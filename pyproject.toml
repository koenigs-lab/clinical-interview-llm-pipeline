[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-interview-llm-pipeline"
version = "0.3.0"
description = "Institution-controlled workflow for configurable interview-based clinical rating research"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [
  {name = "Lukas Königs", email = "lukas.koenigs@fu-berlin.de"},
  {name = "Phileas Heim"},
  {name = "Henry Harder"},
  {name = "Christian N. Schmitz"},
  {name = "Maria Böttche"},
  {name = "Joost Hutsebaut"},
  {name = "Christine Knaevelsrud"},
  {name = "André Kerber", email = "andre.kerber@fu-berlin.de"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Repository = "https://github.com/koenigs-lab/clinical-interview-llm-pipeline"

[project.optional-dependencies]
# faster-whisper 1.2 passes an argument that PyAV 19 removed.
asr = ["faster-whisper>=1.1,<2", "av<19"]
diarize = ["pyannote.audio>=4,<5"]
train = [
  "torch>=2.2,<3",
  "transformers>=4.46,<6",
  "peft>=0.13,<1",
  "accelerate>=1,<2",
  "bitsandbytes>=0.45,<1",
]

[project.scripts]
cilp = "clinical_interview_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinical_interview_pipeline = ["resources/*.sh"]
